name: ci

# Every gate this project claims to hold itself to, run on every push.
#
# The jobs that need no key run on every PR. The ones that read live chain state are separate, so a
# testnet outage never looks like a code failure -- and so that a green tick can never be mistaken
# for "the archive is fine" when it only means "the contracts compile".

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  contracts:
    name: contracts — build, test, fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci --prefix contracts || npm install --prefix contracts
      - name: forge build
        run: forge build --sizes
        working-directory: contracts
      - name: forge test
        run: forge test -vv
        working-directory: contracts
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: the public gates compare against this compiled bytecode
        run: (cd worker && (npm ci || npm install)) && node worker/src/gates-manifest.ts --check
        working-directory: .
      - name: forge coverage (MirrorLib and the fail-closed paths)
        run: forge coverage --report summary --no-match-coverage "script|test"
        working-directory: contracts
        continue-on-error: true

  honesty:
    name: honesty — no mocks, no banned claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no fabricated data outside tests
        # Real numbers or none. A stub in src/ or worker/ would make every figure on the site
        # unfalsifiable. Narrow on purpose: an HTML `placeholder=` attribute is not fabricated
        # data, and a gate that cries wolf is a gate somebody switches off.
        run: |
          if grep -rniE "\\bmock[A-Z_]|\\bfakeData\\b|\\bdummyData\\b|faker\\.|lorem ipsum|placeholder data|TODO: replace|hardcoded for now" \
               --include="*.ts" --include="*.tsx" --include="*.sol" \
               web/src worker/src packages contracts/src; then
            echo "::error::fabricated or stubbed data outside tests"; exit 1
          fi
          echo "clean"
      - name: no score, no passport, no credit rating
        # The desk pays or refuses and says why. Anything that turns a bond into an attribute is out of
        # scope, and saying so ("not a credit score") is the only way these words may appear.
        run: |
          hits=$(grep -rniE "credit[ -]?scor|\\bFICO\\b|\\b300 ?[-–] ?850\\b|\\bpassport\\b|soulbound|credit[ -]?rating|creditworthiness|reputation score|trust score" \
               --include="*.ts" --include="*.tsx" --include="*.sol" --include="*.md" --include="*.html" --include="*.js" \
               web/src web/index.html web/*/index.html worker/src packages/mirror/src packages/mirror/README.md contracts/src README.md CLAIMS.md docs 2>/dev/null \
               | grep -viE "\\bnot an? |\\bno (credit|score|passport)|\\bnever an? |\\bnothing (here|on this)|isn.t an? " || true)
          if [ -n "$hits" ]; then echo "$hits"; echo "::error::a score, rating or passport is not something this project makes"; exit 1; fi
          echo "clean"
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: CLAIMS.md is generated from the measured record, not typed
        run: node worker/src/claims-doc.ts --check
      - name: claims stronger than the evidence
        # Only *assertions* are banned, never discussion. `AbsenceRegistry` explains at length why
        # proof of absence is impossible, and must stay able to say so.
        run: |
          if grep -rniE "we prove[sd]? (that )?(it )?never|proves absence|absence is proven|proven absence|provably never (happened|occurred)|trustless|100% secure|fully audited|audited by" \
               --include="*.ts" --include="*.tsx" --include="*.sol" --include="*.md" \
               web/src worker/src packages contracts/src README.md CLAIMS.md docs 2>/dev/null \
               | grep -viE "never proves|never prove|not prove|cannot prove|does not prove|is not audited|not claimed|never claim"; then
            echo "::error::a claim stronger than the evidence — see CLAIMS.md"; exit 1
          fi
          echo "clean"

  worker:
    name: worker — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci || npm install
        working-directory: worker
      - run: npx tsc -p .
        working-directory: worker
        env: { NODE_ENV: '' }

  web:
    name: web — typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
        env: { NODE_ENV: '' }
      - run: npx vite build
        working-directory: web
        env: { NODE_ENV: '' }

  live:
    name: live chain — differential vs 0x0FD2, and the published numbers
    runs-on: ubuntu-latest
    # Reads public RPCs only; no secrets, so a fork can run it too.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm ci || npm install
        working-directory: worker
      - name: differential against the live precompile
        run: node src/differential.ts --limit 12
        working-directory: worker
      - name: every published number still matches the chain, on both source chains
        run: node src/measure.ts --check
        working-directory: worker
      - name: the package verifies a second transaction cold, with no .env
        run: |
          npm install --no-audit --no-fund
          env -i PATH="$PATH" HOME="$HOME" node packages/mirror/src/cli.js verify 0x1af4ba8e851472119a7ddb193a4fd29863afd005d59a31864dfb176b155c0a52
